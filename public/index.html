<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkUp - Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="chat-container" id="chat-container" style="display: none;">
    <div class="chat-header">
      <div class="header-left">
        <div class="room-avatar"><i class="fa-solid fa-link"></i></div>
        <div class="header-info">
          <h2>LinkUp</h2>
          <span id="online-count">0 online</span>
        </div>
      </div>
      <div class="header-icons">
        <span class="icon-btn coming-soon-btn" title="Voice call (coming soon)"><i class="fa-solid fa-phone"></i></span>
        <span class="icon-btn coming-soon-btn" title="Video call (coming soon)"><i class="fa-solid fa-video"></i></span>
        <span class="icon-btn" id="info-btn" title="Online users"><i class="fa-solid fa-circle-info"></i></span>
        <span class="icon-btn" id="logout-btn" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></span>
      </div>
    </div>

    <ul id="messages"></ul>
    <div id="typing-indicator"></div>

    <form id="form">
      <div class="emoji-wrapper">
        <span class="icon-btn input-icon" id="emoji-btn" title="Emoji"><i class="fa-regular fa-face-smile"></i></span>
        <div class="emoji-panel" id="emoji-panel"></div>
      </div>
      <span class="icon-btn input-icon" id="attach-btn" title="Send image (coming soon)"><i
          class="fa-solid fa-paperclip"></i></span>
      <input type="file" id="image-input" accept="image/*" style="display: none;" />
      <input id="input" autocomplete="off" placeholder="Type a message..." />
      <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <!-- Info side panel: Users + Theme tabs -->
    <div class="info-panel" id="info-panel">
      <div class="info-panel-header">
        <h3 id="panel-title">Online Users</h3>
        <span class="icon-btn" id="close-info-btn"><i class="fa-solid fa-xmark"></i></span>
      </div>

      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="users">Users</button>
        <button class="panel-tab" data-tab="theme">Theme</button>
      </div>

      <div class="panel-view" id="users-view">
        <ul id="online-users-list"></ul>
      </div>

      <div class="panel-view" id="theme-view" style="display: none;">
        <p class="theme-section-label">Mode</p>
        <div class="mode-toggle">
          <button class="mode-btn" data-mode="dark"><i class="fa-solid fa-moon"></i> Dark</button>
          <button class="mode-btn" data-mode="light"><i class="fa-solid fa-sun"></i> Light</button>
        </div>
        <p class="theme-section-label">Background</p>
        <div class="bg-grid" id="bg-grid"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>

</html>
